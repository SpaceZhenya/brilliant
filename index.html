    content: [
      { type: "text", data: "Финальный проект: игра «Угадай число»\n\nЗадача: компьютер загадывает число от 1 до 100, игрок угадывает.\n\nПсевдокод:\n  загадать случайное число от 1 до 100\n  ПОКА (игрок не угадал):\n      попросить ввести число\n      ЕСЛИ (число > загаданное):\n          сказать 'Меньше'\n      ИНАЧЕ ЕСЛИ (число < загаданное):\n          сказать 'Больше'\n      ИНАЧЕ:\n          сказать 'Угадал!'" },
      { type: "example", data: "Полная программа на Python:\n\nimport random\n\nsecret = random.randint(1, 100)\nattempts = 0\n\nprint('Я загадал число от 1 до 100. Угадай!')\n\nwhile True:\n    guess = int(input('Твой вариант: '))\n    attempts += 1\n    if guess > secret:\n        print('Меньше!')\n    elif guess < secret:\n        print('Больше!')\n    else:\n        print(f'Угадал за {attempts} попыток!')\n        break" },
      { type: "exercise", question: "Какая функция Python используется для случайного числа от 1 до 100?", options: ["random.choice(1, 100)", "random.randint(1, 100)", "random.random(100)", "random.rand(1, 100)"], correct: 1, explanation: "random.randint(1, 100) — целое случайное число от 1 до 100" }
    ]
  }
];

const ALL_LESSONS = [...PART1, ...PART2];

function getProgress() {
  try { return JSON.parse(localStorage.getItem('course_progress') || '[]'); } catch { return []; }
}

function saveProgress(done) {
  localStorage.setItem('course_progress', JSON.stringify(done));
}

function isDone(id) {
  return getProgress().includes(id);
}

function markDone(id) {
  const done = getProgress();
  if (!done.includes(id)) { done.push(id); saveProgress(done); }
}

function renderMenu() {
  const done = getProgress();
  const total = ALL_LESSONS.length;
  const completed = done.length;
  const pct = total ? Math.round(completed / total * 100) : 0;

  document.getElementById('progressLabel').textContent = `${completed} / ${total} уроков`;
  document.getElementById('progressPct').textContent = `${pct}%`;
  document.getElementById('progressFill').style.width = pct + '%';

  renderPart('part1', PART1, 1);
  renderPart('part2', PART2, 2);
}

function renderPart(containerId, lessons, partNum) {
  const el = document.getElementById(containerId);
  el.innerHTML = lessons.map((l, i) =>
    `<div class="lesson-card ${isDone(l.id) ? 'done' : ''}" onclick="openLesson(${ALL_LESSONS.indexOf(l)})">
      <span class="status">${isDone(l.id) ? '✓' : '○'}</span>
      <span class="lesson-num">${partNum}.${i+1}</span>
      <span class="lesson-title">${l.title}</span>
    </div>`
  ).join('');
}

function showMenu() {
  document.getElementById('menuView').classList.add('active');
  document.getElementById('lessonView').classList.remove('active');
  renderMenu();
}

function openLesson(index) {
  const lesson = ALL_LESSONS[index];
  document.getElementById('menuView').classList.remove('active');
  document.getElementById('lessonView').classList.add('active');

  document.getElementById('lessonTitle').innerHTML = `${lesson.title} ${isDone(lesson.id) ? '<span class="lesson-done-badge">Пройдено</span>' : ''}`;

  const contentEl = document.getElementById('lessonContent');
  contentEl.innerHTML = '';

  lesson.content.forEach(block => {
    const div = document.createElement('div');
    div.className = `block ${block.type}`;

    if (block.type === 'text') {
      div.textContent = block.data;
    } else if (block.type === 'example') {
      const pre = document.createElement('pre');
      pre.textContent = block.data;
      div.appendChild(pre);
    } else if (block.type === 'exercise') {
      div.innerHTML = `<div class="question">${block.question}</div>`;
      const optionsDiv = document.createElement('div');
      block.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.textContent = opt;
        btn.onclick = function() { checkAnswer(this, i, block.correct, block.explanation); };
        optionsDiv.appendChild(btn);
      });
      div.appendChild(optionsDiv);
      const expl = document.createElement('div');
      expl.className = 'explanation';
      expl.textContent = block.explanation;
      div.appendChild(expl);
    }

    contentEl.appendChild(div);
  });

  // auto-mark as done when opening
  if (!isDone(lesson.id)) {
    markDone(lesson.id);
    // update badge
    document.getElementById('lessonTitle').innerHTML = `${lesson.title} ${'<span class="lesson-done-badge">Пройдено</span>'}`;
  }
}

function checkAnswer(btn, selected, correct, explanation) {
  const parent = btn.parentElement.parentElement;
  const allOpts = parent.querySelectorAll('.opt');
  const explDiv = parent.querySelector('.explanation');

  // disable all
  allOpts.forEach(b => { b.disabled = true; b.classList.add('disabled'); });

  if (selected === correct) {
    btn.classList.add('correct');
    explDiv.className = 'explanation show correct';
  } else {
    btn.classList.add('wrong');
    allOpts[correct].classList.add('correct');
    explDiv.className = 'explanation show wrong';
  }
}

renderMenu();
</script>
