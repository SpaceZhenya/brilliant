<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Псевдокод → Python — Интерактивный курс</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1a1a2e, #16213e); border-bottom: 1px solid #2a2a4a; padding: 20px; text-align: center; }
  .header h1 { font-size: 1.6em; color: #a78bfa; }
  .header p { color: #888; margin-top: 4px; font-size: 0.9em; }
  .container { max-width: 760px; margin: 0 auto; padding: 20px; }

  /* Menu */
  .progress-bar { background: #1e1e32; border-radius: 10px; height: 12px; overflow: hidden; margin: 16px 0; }
  .progress-fill { background: linear-gradient(90deg, #7c3aed, #a78bfa); height: 100%; border-radius: 10px; transition: width 0.4s; }
  .progress-text { display: flex; justify-content: space-between; color: #888; font-size: 0.85em; margin-bottom: 4px; }
  .part-title { font-size: 1.2em; font-weight: 700; color: #a78bfa; margin: 24px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #2a2a4a; }
  .lesson-card { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 10px; padding: 14px 18px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
  .lesson-card:hover { border-color: #7c3aed; background: #1e1e35; }
  .lesson-card.done { border-color: #2d4a2d; }
  .status { font-size: 1.1em; width: 24px; color: #555; }
  .lesson-card.done .status { color: #4ade80; }
  .lesson-num { color: #666; font-size: 0.8em; min-width: 28px; }
  .lesson-title { flex: 1; }
  .lesson-card.done .lesson-title { color: #4ade80; }

  /* Views */
  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.25s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Start screen */
  .start-screen { text-align: center; padding: 40px 20px; }
  .start-screen .icon { font-size: 3em; margin-bottom: 16px; }
  .start-screen h2 { color: #a78bfa; font-size: 1.5em; margin-bottom: 8px; }
  .start-screen .subtitle { color: #888; margin-bottom: 24px; }
  .start-screen .desc { color: #aaa; line-height: 1.6; margin-bottom: 32px; max-width: 500px; margin-left: auto; margin-right: auto; }
  .btn-primary { background: #7c3aed; color: #fff; border: none; padding: 12px 40px; border-radius: 30px; font-size: 1em; cursor: pointer; transition: background 0.2s; font-weight: 600; }
  .btn-primary:hover { background: #6d28d9; }
  .btn-secondary { background: none; border: 1px solid #2a2a4a; color: #a78bfa; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
  .btn-secondary:hover { background: #2a2a4a; }

  /* Lesson content */
  .content-block { display: none; }
  .content-block.active { display: block; }
  .block { background: #1a1a2e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  .block.text { white-space: pre-wrap; line-height: 1.7; color: #ccc; font-size: 1.05em; }
  .block.example { border-left: 4px solid #4ade80; }
  .block.example::before { content: 'ПРИМЕР'; color: #4ade80; font-weight: 700; font-size: 0.75em; letter-spacing: 1px; display: block; margin-bottom: 10px; }
  .block pre { background: #0a0a14; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 0.95em; line-height: 1.6; color: #a8d8ea; margin-top: 8px; }
  .block code { background: #0a0a14; padding: 2px 8px; border-radius: 4px; font-size: 0.95em; }
  .block .question { font-size: 1.1em; margin-bottom: 16px; color: #f0f0f0; font-weight: 500; }
  .opt { display: block; width: 100%; text-align: left; background: #0f0f1a; border: 1px solid #2a2a4a; color: #ccc; padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; font-size: 1em; }
  .opt:hover { border-color: #7c3aed; }
  .opt.correct { border-color: #4ade80; background: #1a3a1a; color: #4ade80; }
  .opt.wrong { border-color: #f87171; background: #3a1a1a; color: #f87171; }
  .opt.disabled { cursor: default; opacity: 0.7; }
  .explanation { margin-top: 12px; padding: 14px; background: #1e1e32; border-radius: 8px; font-size: 0.95em; display: none; line-height: 1.5; }
  .explanation.show { display: block; }
  .explanation.correct { border-left: 4px solid #4ade80; }
  .explanation.wrong { border-left: 4px solid #f87171; }

  /* Continue button */
  .continue-wrap { text-align: center; margin: 20px 0; }
  .btn-continue { background: #7c3aed; color: #fff; border: none; padding: 14px 48px; border-radius: 30px; font-size: 1.05em; cursor: pointer; transition: all 0.2s; font-weight: 600; }
  .btn-continue:hover { background: #6d28d9; transform: translateY(-1px); }
  .btn-continue:disabled { background: #3a3a5a; cursor: not-allowed; transform: none; }

  /* End screen */
  .end-screen { text-align: center; padding: 50px 20px; }
  .end-screen .check { font-size: 4em; color: #4ade80; margin-bottom: 12px; }
  .end-screen h2 { color: #4ade80; font-size: 1.6em; margin-bottom: 8px; }
  .end-screen .sub { color: #888; margin-bottom: 32px; }

  /* Step counter */
  .step-counter { text-align: center; color: #555; font-size: 0.85em; margin-bottom: 16px; }

  .lesson-done-badge { display: inline-block; background: #1a3a1a; color: #4ade80; padding: 4px 12px; border-radius: 12px; font-size: 0.8em; margin-left: 8px; }

  @media (max-width: 600px) { .container { padding: 12px; } .header h1 { font-size: 1.2em; } }
</style>
</head>
<body>
<div class="header">
  <h1>Псевдокод → Python</h1>
  <p>Интерактивный курс в стиле Brilliant</p>
</div>

<div class="container" id="app">
  <!-- MENU -->
  <div id="menuView" class="view active">
    <div class="progress-text">
      <span id="progressLabel">0 / 15 уроков</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="part-title">Часть 1: Псевдокод</div>
    <div id="part1"></div>
    <div class="part-title">Часть 2: Python</div>
    <div id="part2"></div>
  </div>

  <!-- START LESSON SCREEN -->
  <div id="startView" class="view">
    <div class="start-screen">
      <div class="icon" id="startIcon">📘</div>
      <h2 id="startTitle"></h2>
      <div class="subtitle" id="startSubtitle"></div>
      <div class="desc" id="startDesc"></div>
      <button class="btn-primary" onclick="beginLesson()">Начать урок</button>
      <br><br>
      <button class="btn-secondary" onclick="showMenu()">← Назад</button>
    </div>
  </div>

  <!-- LESSON VIEW -->
  <div id="lessonView" class="view">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <button class="btn-secondary" onclick="confirmExit()">← Выйти</button>
      <span id="lessonViewTitle" style="color:#a78bfa;font-weight:600"></span>
      <span id="lessonViewProgress" style="color:#555;font-size:0.85em"></span>
    </div>
    <div id="lessonContent"></div>
    <div class="step-counter" id="stepCounter"></div>
    <div class="continue-wrap" id="continueWrap">
      <button class="btn-continue" id="continueBtn" onclick="nextBlock()">Продолжить</button>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="endView" class="view">
    <div class="end-screen">
      <div class="check">★</div>
      <h2>Урок пройден!</h2>
      <div class="sub" id="endSub">Отличная работа!</div>
      <button class="btn-primary" onclick="showMenu()">К списку уроков</button>
      <br><br>
      <button class="btn-secondary" onclick="startLesson(currentLessonIndex)">Пройти ещё раз</button>
    </div>
  </div>

  <!-- CONFIRM EXIT MODAL -->
  <div id="exitModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center" onclick="if(event.target===this)this.style.display='none'">
    <div style="background:#1a1a2e;border:1px solid #2a2a4a;border-radius:12px;padding:30px;max-width:360px;text-align:center">
      <p style="margin-bottom:20px;color:#ccc">Выйти из урока? Прогресс сохранится.</p>
      <button class="btn-primary" onclick="document.getElementById('exitModal').style.display='none';showMenu()" style="margin-right:8px">Выйти</button>
      <button class="btn-secondary" onclick="document.getElementById('exitModal').style.display='none'">Остаться</button>
    </div>
  </div>
</div>

<script>
const PART1 = [
  {
    id: "p1_intro", title: "Что такое алгоритм?", icon: "🧠",
    subtitle: "Урок 1.1",
    desc: "Узнай, что такое алгоритмы, зачем они нужны и как их записывать с помощью псевдокода.",
    content: [
      { type: "text", data: "Алгоритм — это последовательность шагов для решения задачи.\n\nПредставь, что ты робот. Каждую команду нужно формулировать чётко и однозначно, иначе робот не поймёт, что делать.\n\nПример из жизни — рецепт бутерброда:\n  1. Взять хлеб\n  2. Намазать масло\n  3. Положить сыр\n  4. Накрыть вторым куском хлеба\n\nЭто и есть алгоритм! В программировании мы используем псевдокод — язык, похожий на человеческий, но с чёткими правилами." },
      { type: "text", data: "Почему алгоритмы так важны?\n\n• Они заставляют мыслить структурированно\n• Помогают разбивать сложные задачи на простые шаги\n• Любой код — это реализация какого-то алгоритма\n\nЧем лучше ты придумываешь алгоритмы, тем лучшим программистом становишься. Это навык, который тренируется!" },
      { type: "example", data: "Задача: робот стоит в комнате и хочет выйти. На пути могут быть стулья.\n\nПсевдокод:\n  ПОКА есть препятствие:\n      обойти препятствие\n  ИДТИ к двери\n  ОТКРЫТЬ дверь\n  ВЫЙТИ" },
      { type: "exercise", question: "Что такое алгоритм?", options: ["Случайный набор команд", "Последовательность шагов для решения задачи", "Язык программирования", "Компьютерное устройство"], correct: 1, explanation: "Алгоритм — это именно последовательность чётких шагов для достижения цели." }
    ]
  },
  {
    id: "p1_vars", title: "Переменные и данные", icon: "📦",
    subtitle: "Урок 1.2",
    desc: "Познакомься с переменными — способом хранить и изменять данные в программе.",
    content: [
      { type: "text", data: "Переменная — это коробка с именем, в которой хранится значение.\n\nВ псевдокоде:\n  число x = 5\n  имя = 'Анна'\n  возраст = 25\n  цена = 99.99\n\nИмя переменной придумываешь ты сам. Оно должно быть понятным, чтобы через месяц ты не гадал, что значит 'a' или 'b'." },
      { type: "text", data: "Типы данных в псевдокоде:\n\n  🔢 Числа — целые (5, -10, 100) и дробные (3.14, 0.5)\n  📝 Строки — текст в кавычках ('Привет', 'Анна')\n  ✅ Логические — Истина или Ложь\n  📦 Списки — набор элементов [1, 2, 3, 4, 5]\n\nЗапомни: у каждой переменной есть имя, тип и значение." },
      { type: "example", data: "Псевдокод: работа с переменными\n\n  сумма = 100           # целое число\n  скидка_процент = 20   # целое число\n  имя_клиента = 'Иван'  # строка\n  итог = сумма - (сумма * скидка_процент / 100)\n  ВЫВЕСТИ итог          # 80" },
      { type: "exercise", question: "Какое значение у переменной x после выполнения: x = 10; x = x + 5;", options: ["5", "10", "15", "105"], correct: 2, explanation: "Сначала x = 10. Потом x = 10 + 5 = 15. Переменная перезаписывается." }
    ]
  },
  {
    id: "p1_conditions", title: "Условные конструкции", icon: "🔀",
    subtitle: "Урок 1.3",
    desc: "Научись использовать условия, чтобы программа принимала решения.",
    content: [
      { type: "text", data: "Условия позволяют программе принимать решения в зависимости от данных.\n\nВ псевдокоде:\n  ЕСЛИ (условие):\n      действие 1\n  ИНАЧЕ:\n      действие 2\n\nЕсли условие истинно — выполняется первая ветка. Если ложно — вторая." },
      { type: "text", data: "Операции сравнения:\n\n  =   равно\n  ≠   не равно\n  >   больше\n  <   меньше\n  ≥   больше или равно\n  ≤   меньше или равно\n\nЛогические операции:\n  И  — оба условия истинны\n  ИЛИ — хотя бы одно истинно\n  НЕ — отрицание" },
      { type: "example", data: "Проверка доступа:\n\n  возраст = 16\n  ЕСЛИ возраст ≥ 18:\n      ВЫВЕСТИ 'Доступ разрешён'\n  ИНАЧЕ:\n      ВЫВЕСТИ 'Доступ запрещён'\n\nРезультат: 'Доступ запрещён', потому что 16 < 18." },
      { type: "exercise", question: "Что выведет этот код? x = 7; ЕСЛИ x > 10: ВЫВЕСТИ 'A' ИНАЧЕ: ВЫВЕСТИ 'B'", options: ["A", "B", "Ничего", "Ошибка"], correct: 1, explanation: "7 > 10 — это Ложь, поэтому выполняется блок ИНАЧЕ и выводится 'B'." }
    ]
  },
  {
    id: "p1_loops", title: "Циклы", icon: "🔄",
    subtitle: "Урок 1.4",
    desc: "Изучи циклы — способ повторять действия, не копируя код десятки раз.",
    content: [
      { type: "text", data: "Циклы — одна из самых мощных идей в программировании. Они позволяют повторять действия много раз, не копируя код.\n\nДва основных вида циклов в псевдокоде:\n\n1) ПОКА (while) — повторять, ПОКА условие истинно:\n     ПОКА (есть вода):\n         пить\n\n2) ДЛЯ (for) — повторять ДЛЯ каждого элемента:\n     ДЛЯ каждого числа из списка:\n         ВЫВЕСТИ число" },
      { type: "text", data: "Как работают циклы ПОКА:\n\n  i = 1\n  ПОКА (i ≤ 5):\n      ВЫВЕСТИ i\n      i = i + 1\n\nШаг 1: i=1, 1≤5 → да → вывести 1, i=2\nШаг 2: i=2, 2≤5 → да → вывести 2, i=3\nШаг 3: i=3, 3≤5 → да → вывести 3, i=4\nШаг 4: i=4, 4≤5 → да → вывести 4, i=5\nШаг 5: i=5, 5≤5 → да → вывести 5, i=6\nШаг 6: i=6, 6≤5 → нет → выход из цикла\n\nВывод: 1, 2, 3, 4, 5" },
      { type: "example", data: "Твой пример с мячами на псевдокоде:\n\n  balls = 3\n  ПОКА (balls > 0):\n      move forward\n      balls = balls - 1\n\nПока есть мячи — двигаемся вперёд. На каждом шаге забираем один мяч." },
      { type: "exercise", question: "Сколько раз выполнится тело цикла? i = 1; ПОКА i ≤ 3: ВЫВЕСТИ i; i = i + 1", options: ["2", "3", "4", "Бесконечно"], correct: 1, explanation: "i проходит значения 1, 2, 3 — всего 3 итерации. При i=4 условие 4≤3 ложно." }
    ]
  },
  {
    id: "p1_lists", title: "Списки и перебор", icon: "📋",
    subtitle: "Урок 1.5",
    desc: "Узнай, как хранить множество значений в одной переменной и перебирать их.",
    content: [
      { type: "text", data: "Список (массив) — это набор элементов, хранящихся под одним именем.\n\nВ псевдокоде:\n  студенты = ['Анна', 'Борис', 'Вика']\n  оценки = [85, 92, 78, 95]\n\nКаждый элемент имеет индекс — номер позиции. Индексация начинается с 0!\n\n  студенты[0] → 'Анна'    (первый элемент)\n  студенты[1] → 'Борис'   (второй элемент)\n  студенты[2] → 'Вика'    (третий элемент)" },
      { type: "text", data: "Перебор списка — одна из самых частых операций.\n\nВ псевдокоде:\n  ДЛЯ КАЖДОГО студента ИЗ студенты:\n      ВЫВЕСТИ студент\n\nЭто выведет всех студентов по очереди. Не нужно писать:\n  ВЫВЕСТИ студенты[0]\n  ВЫВЕСТИ студенты[1]\n  ВЫВЕСТИ студенты[2]\n\nЦикл сделает это за тебя — и работает для списка любой длины!" },
      { type: "exercise", question: "Чему равно число[2] в списке числа = [10, 20, 30, 40]?", options: ["10", "20", "30", "40"], correct: 2, explanation: "Индексация с 0: [0]=10, [1]=20, [2]=30, [3]=40" }
    ]
  },
  {
    id: "p1_functions", title: "Функции", icon: "⚙️",
    subtitle: "Урок 1.6",
    desc: "Научись создавать функции — многократно используемые блоки кода.",
    content: [
      { type: "text", data: "Функция — это именованный блок кода, который можно вызывать многократно.\n\nЗачем нужны функции?\n\n  • Не повторять код — написал один раз, используй где угодно\n  • Разбивать большую задачу на маленькие части\n  • Делать код понятнее и удобнее для чтения\n  • Легче находить и исправлять ошибки\n\nВ псевдокоде:\n  ФУНКЦИЯ имя(параметры):\n      действия\n      ВЕРНУТЬ результат" },
      { type: "text", data: "Функция может принимать ВХОДНЫЕ ДАННЫЕ (параметры) и ВОЗВРАЩАТЬ результат.\n\nПример: функция удвоения числа.\n\n  ФУНКЦИЯ double(x):\n      ВЕРНУТЬ x * 2\n\nКогда ты пишешь double(5), то:\n  • Функция получает x = 5\n  • Вычисляет 5 * 2 = 10\n  • Возвращает 10 обратно\n\nТеперь можно вызвать double(3) → 6, double(10) → 20 и т.д." },
      { type: "example", data: "Функция проверки чётности числа:\n\n  ФУНКЦИЯ is_even(n):\n      ЕСЛИ n % 2 = 0:\n          ВЕРНУТЬ Истина\n      ИНАЧЕ:\n          ВЕРНУТЬ Ложь\n\n  ВЫВЕСТИ is_even(4)   # Истина\n  ВЫВЕСТИ is_even(7)   # Ложь" },
      { type: "exercise", question: "Что вернёт вызов double(5)? ФУНКЦИЯ double(x): ВЕРНУТЬ x * 2", options: ["5", "10", "25", "2"], correct: 1, explanation: "double(5) = 5 * 2 = 10. Функция принимает 5, умножает на 2 и возвращает результат." }
    ]
  },
  {
    id: "p1_algo", title: "Простые алгоритмы", icon: "🔍",
    subtitle: "Урок 1.7",
    desc: "Примени всё, что выучил — напишем настоящие алгоритмы поиска и подсчёта.",

const ALL_LESSONS = [...PART1, ...PART2];

let currentLessonIndex = 0;
let currentBlock = 0;
let blocksCompleted = false;

function getProgress() {
  try { return JSON.parse(localStorage.getItem('course_progress') || '[]'); } catch { return []; }
}
function saveProgress(done) {
  localStorage.setItem('course_progress', JSON.stringify(done));
}
function isDone(id) {
  return getProgress().includes(id);
}
function markDone(id) {
  const done = getProgress();
  if (!done.includes(id)) { done.push(id); saveProgress(done); }
}

function renderMenu() {
  const done = getProgress();
  const total = ALL_LESSONS.length;
  const completed = done.length;
  const pct = total ? Math.round(completed / total * 100) : 0;
  document.getElementById('progressLabel').textContent = completed + ' / ' + total + ' уроков';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('part1').innerHTML = PART1.map((l, i) =>
    '<div class="lesson-card ' + (isDone(l.id) ? 'done' : '') + '" onclick="startLesson(' + ALL_LESSONS.indexOf(l) + ')">' +
      '<span class="status">' + (isDone(l.id) ? '✓' : '○') + '</span>' +
      '<span class="lesson-num">1.' + (i+1) + '</span>' +
      '<span class="lesson-title">' + l.title + '</span>' +
    '</div>'
  ).join('');
  document.getElementById('part2').innerHTML = PART2.map((l, i) =>
    '<div class="lesson-card ' + (isDone(l.id) ? 'done' : '') + '" onclick="startLesson(' + ALL_LESSONS.indexOf(l) + ')">' +
      '<span class="status">' + (isDone(l.id) ? '✓' : '○') + '</span>' +
      '<span class="lesson-num">2.' + (i+1) + '</span>' +
      '<span class="lesson-title">' + l.title + '</span>' +
    '</div>'
  ).join('');
}

function showMenu() {
  document.getElementById('exitModal').style.display = 'none';
  ['menuView','startView','lessonView','endView'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('menuView').classList.add('active');
  renderMenu();
}

function startLesson(index) {
  currentLessonIndex = index;
  const lesson = ALL_LESSONS[index];
  document.getElementById('startIcon').textContent = lesson.icon || '📘';
  document.getElementById('startTitle').textContent = lesson.title;
  document.getElementById('startSubtitle').textContent = lesson.subtitle || 'Урок ' + (index + 1);
  document.getElementById('startDesc').textContent = lesson.desc || '';
  ['menuView','startView','lessonView','endView'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('startView').classList.add('active');
}

function beginLesson() {
  currentBlock = 0;
  blocksCompleted = false;
  const lesson = ALL_LESSONS[currentLessonIndex];
  ['menuView','startView','lessonView','endView'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('lessonView').classList.add('active');
  document.getElementById('lessonViewTitle').textContent = lesson.title;
  document.getElementById('lessonViewProgress').textContent = '';
  renderBlock(0);
}

function renderBlock(index) {
  const lesson = ALL_LESSONS[currentLessonIndex];
  const contentEl = document.getElementById('lessonContent');
  const total = lesson.content.length;
  contentEl.innerHTML = '';

  if (index >= total) {
    finishLesson();
    return;
  }

  document.getElementById('stepCounter').textContent = 'Шаг ' + (index + 1) + ' из ' + total;
  document.getElementById('lessonViewProgress').textContent = (index + 1) + ' / ' + total;

  const block = lesson.content[index];
  const div = document.createElement('div');
  div.className = 'block ' + block.type;

  if (block.type === 'text') {
    div.textContent = block.data;
    document.getElementById('continueBtn').textContent = index < total - 1 ? 'Продолжить' : 'Завершить урок';
    document.getElementById('continueBtn').disabled = false;
    document.getElementById('continueBtn').onclick = () => nextBlock();
  } else if (block.type === 'example') {
    const pre = document.createElement('pre');
    pre.textContent = block.data;
    div.appendChild(pre);
    document.getElementById('continueBtn').textContent = index < total - 1 ? 'Продолжить' : 'Завершить урок';
    document.getElementById('continueBtn').disabled = false;
    document.getElementById('continueBtn').onclick = () => nextBlock();
  } else if (block.type === 'exercise') {
    div.innerHTML = '<div class="question">' + block.question + '</div>';
    const optionsDiv = document.createElement('div');
    block.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = opt;
      btn.onclick = function() { checkAnswer(this, i, block.correct, block.explanation, index, total); };
      optionsDiv.appendChild(btn);
    });
    div.appendChild(optionsDiv);
    const expl = document.createElement('div');
    expl.className = 'explanation';
    expl.textContent = block.explanation;
    div.appendChild(expl);
    document.getElementById('continueBtn').textContent = 'Выбери ответ';
    document.getElementById('continueBtn').disabled = true;
  }

  contentEl.appendChild(div);
  contentEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function checkAnswer(btn, selected, correct, explanation, index, total) {
  const parent = btn.parentElement.parentElement;
  const allOpts = parent.querySelectorAll('.opt');
  const explDiv = parent.querySelector('.explanation');
  allOpts.forEach(b => { b.disabled = true; b.classList.add('disabled'); });
  if (selected === correct) {
    btn.classList.add('correct');
    explDiv.className = 'explanation show correct';
  } else {
    btn.classList.add('wrong');
    allOpts[correct].classList.add('correct');
    explDiv.className = 'explanation show wrong';
  }
  document.getElementById('continueBtn').textContent = index < total - 1 ? 'Продолжить' : 'Завершить урок';
  document.getElementById('continueBtn').disabled = false;
  document.getElementById('continueBtn').onclick = () => nextBlock();
}

function nextBlock() {
  currentBlock++;
  renderBlock(currentBlock);
}

function finishLesson() {
  const lesson = ALL_LESSONS[currentLessonIndex];
  markDone(lesson.id);
  ['menuView','startView','lessonView','endView'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('endView').classList.add('active');
  const done = getProgress().length;
  const total = ALL_LESSONS.length;
  document.getElementById('endSub').textContent = 'Пройдено ' + done + ' из ' + total + ' уроков (' + Math.round(done/total*100) + '%)';
}

function confirmExit() {
  document.getElementById('exitModal').style.display = 'flex';
}

renderMenu();
</script>
</body>
</html>
